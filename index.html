<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0d10;
    --bg-elev: #14171b;
    --border: #262a30;
    --text: #eef0f2;
    --text-dim: #9aa2ac;
    --accent: #ff6a3d;
    --accent-dim: #7a3420;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }

  header.hero{
    padding: 72px 24px 40px;
    text-align:center;
    border-bottom: 1px solid var(--border);
    background:
      radial-gradient(60% 100% at 50% 0%, rgba(255,106,61,0.12), transparent 70%),
      var(--bg);
  }
  header.hero .eyebrow{
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 14px;
  }
  header.hero h1{
    font-size: clamp(32px, 6vw, 56px);
    margin: 0 0 14px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  header.hero p{
    color: var(--text-dim);
    font-size: 17px;
    max-width: 620px;
    margin: 0 auto;
    line-height: 1.6;
  }

  nav.catnav{
    position: sticky;
    top: 0;
    z-index: 40;
    display:flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 20px;
    background: rgba(11,13,16,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  nav.catnav::-webkit-scrollbar{ display:none; }
  nav.catnav a{
    flex: 0 0 auto;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-dim);
    border: 1px solid var(--border);
    text-decoration: none;
    white-space: nowrap;
    transition: all .15s ease;
  }
  nav.catnav a:hover{ color: var(--text); border-color: #3a3f47; }

  main{ max-width: 1180px; margin: 0 auto; padding: 10px 20px 80px; }

  section.category{
    padding: 56px 0 24px;
    border-bottom: 1px solid var(--border);
  }
  section.category:last-child{ border-bottom: none; }

  .cat-head{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 26px;
  }
  .cat-head h2{
    font-size: clamp(22px, 3.4vw, 30px);
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .cat-count{
    color: var(--text-dim);
    font-size: 13.5px;
    margin-top: 4px;
    display:block;
  }
  .drive-link{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    color: var(--text);
    transition: all .15s ease;
    flex: 0 0 auto;
  }
  .drive-link:hover{ border-color: var(--accent); color: var(--accent); }

  h3.subhead{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--text-dim);
    margin: 30px 0 16px;
    font-weight: 700;
  }

  .photo-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .photo-grid figure{
    margin:0;
    aspect-ratio: 4/3;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    cursor: zoom-in;
    position: relative;
  }
  .photo-grid img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    transition: transform .35s ease;
    background: var(--bg-elev);
  }
  .photo-grid figure:hover img{ transform: scale(1.06); }

  .video-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 16px;
  }
  .video-card{
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .video-card .frame-wrap{
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background:#000;
  }
  .video-card iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
  }
  .video-card .label{
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
  }

  /* lightbox */
  #lightbox{
    position: fixed; inset:0;
    background: rgba(4,5,6,0.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 100;
    padding: 30px;
  }
  #lightbox.open{ display:flex; }
  #lightbox img{
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #lightbox .close{
    position: absolute;
    top: 22px; right: 26px;
    font-size: 30px;
    color: #fff;
    cursor: pointer;
    opacity: .8;
    line-height:1;
  }
  #lightbox .close:hover{ opacity:1; }

  footer{
    text-align:center;
    padding: 40px 20px 60px;
    color: var(--text-dim);
    font-size: 13px;
  }

  @media (max-width: 560px){
    header.hero{ padding: 52px 18px 32px; }
    section.category{ padding: 40px 0 16px; }
    .video-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">Portafolio de proyectos</div>
  <h1>Mecanismos &amp; Estructuras Especiales</h1>

</header>

<nav class="catnav" id="catnav"></nav>

<main id="main"></main>

<div id="lightbox">
  <span class="close" id="lightboxClose">&times;</span>
  <img id="lightboxImg" src="" alt="">
</div>

<footer>Portafolio construido a partir del contenido alojado en Google Drive.</footer>

const navEl = document.getElementById('catnav');
const mainEl = document.getElementById('main');

CATEGORIES.forEach(cat => {
  // nav pill
  const a = document.createElement('a');
  a.href = `#${cat.key}`;
  a.textContent = cat.title;
  navEl.appendChild(a);

  // section
  const section = document.createElement('section');
  section.className = 'category';
  section.id = cat.key;

  const totalPhotos = cat.photosTotal || cat.photos.length;
  const totalVideos = cat.videosTotal || cat.videos.length;

  section.innerHTML = `
    <div class="cat-head">
      <div>
        <h2>${cat.title}</h2>
        <span class="cat-count">${totalPhotos} fotos · ${totalVideos} videos en Drive</span>
      </div>
      <a class="drive-link" href="${folderUrl(cat.folder)}" target="_blank" rel="noopener">Ver todo en Drive &rarr;</a>
    </div>
  `;

  if (cat.photos.length){
    const h = document.createElement('h3');
    h.className = 'subhead';
    h.textContent = 'Fotos destacadas';
    section.appendChild(h);

    const grid = document.createElement('div');
    grid.className = 'photo-grid';
    cat.photos.forEach(id => {
      const fig = document.createElement('figure');
      fig.innerHTML = `<img loading="lazy" src="${imgUrl(id, 500)}" data-full="${imgUrl(id, 1600)}" alt="${cat.title}">`;
      fig.addEventListener('click', () => openLightbox(fig.querySelector('img').dataset.full));
      grid.appendChild(fig);
    });
    section.appendChild(grid);
  }

  if (cat.videos.length){
    const h = document.createElement('h3');
    h.className = 'subhead';
    h.textContent = 'Videos destacados';
    section.appendChild(h);

    const grid = document.createElement('div');
    grid.className = 'video-grid';
    cat.videos.forEach((id, i) => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <div class="frame-wrap">
          <iframe src="${vidUrl(id)}" loading="lazy" allow="autoplay" allowfullscreen></iframe>
        </div>
        <div class="label">${cat.title} · Video ${i+1}</div>
      `;
      grid.appendChild(card);
    });
    section.appendChild(grid);
  }

  mainEl.appendChild(section);
});

// lightbox behavior
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

</html>
