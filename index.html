<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Paleta ampliada (14 colores), extraída por muestreo de la imagen de
     referencia "XITE" que compartió Ernesto: un grid de tarjetas con
     texto saturado sobre fondos de tono relacionado, mezclando tonos
     pastel y tonos muy vivos. Más negro puro para las celdas "vacías"
     del mosaico, como el grid de logos de la referencia de Afternow en
     Dribbble. */
  :root{
    --bg: #ffffff;
    --ink: #0a0a0a;
    --ink-dim: #6b6a61;
    --header-bg: #0a0a0a;
    --header-ink: #ffffff;
    --c-verde: #6fea76;
    --c-lavanda: #c899f7;
    --c-red-ryb: #fe2712;
    --c-naranja: #ea6e34;
    --c-celeste: #8fd6f9;
    --c-azul: #52aff6;
    --c-amarillo: #fefc57;
    --c-lila: #eca5ed;
    --c-verde-lima: #c7d84a;
    --c-violeta: #7516e2;
    --c-menta: #83c8a2;
    --cols: 6;
    /* La altura de fila debe igualar el ancho real de columna para que
       las celdas chicas sean cuadrados 1:1 y las anchas queden 2:1. El
       grid es a todo el ancho (100vw, sin padding), así que el ancho de
       columna es (100vw - gaps) / cols. */
    --unit: calc((100vw - (var(--cols) - 1) * 2px) / var(--cols));
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }
  .mono{ font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }

  /* ---------- Header: negro, tipografía blanca, compacto (menos alto
     que la referencia de Afternow, que gasta mucho alto en botones e
     iconos que aquí no necesitamos). header.hero (logotipo + botones de
     categoría) es lo que queda fijo arriba al hacer scroll; para que un
     elemento sticky se quede pegado durante TODO el scroll de la página
     necesita vivir directo en el flujo del body (su "contenedor" sticky
     es la altura completa de la página) — por eso .hero-desc, el texto
     de descripción, va fuera de <header>, como hermano siguiente, y así
     se desplaza normalmente con el resto del contenido en vez de quedar
     atrapado dentro de una franja de solo ~160px de alto. */
  header.hero{
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--header-bg);
    color: var(--header-ink);
    padding: 18px 24px 14px;
  }
  header.hero .top-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .logo-slot{
    display:flex;
    align-items:center;
    gap: 10px;
    min-height: 28px; /* espacio reservado para un logotipo real */
  }
  .logo-mark{
    display:block;
    width:auto;
  }
  header.hero h1{
    /* Mitad del tamaño original (era clamp(20px, 3.2vw, 30px)). */
    font-size: clamp(10px, 1.6vw, 15px);
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.15;
    text-align: right;
  }
  /* No sticky: vive fuera de header.hero, así que se desplaza con el
     resto de la página en cuanto se hace scroll. Mismo fondo negro para
     que, en la posición inicial (scroll 0), se vea continuo con el
     header de arriba. Sin max-width: ocupa todo el ancho de la página. */
  .hero-desc{
    background: var(--header-bg);
    color: #b9b8b0;
    font-size: 13.5px;
    margin: 0;
    padding: 16px 24px 20px;
    line-height: 1.5;
  }

  nav.catnav{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 16px;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  nav.catnav::-webkit-scrollbar{ display:none; }
  nav.catnav a{
    flex: 0 0 auto;
    padding: 6px 12px;
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
    color: #fff;
    background: transparent;
    border: 1px solid #fff;
    text-decoration: none;
    white-space: nowrap;
    transition: background .12s ease, color .12s ease;
  }
  nav.catnav a:hover{ background: #fff; color: #000; }

  /* ---------- Cuerpo: mosaico full-bleed, sin padding lateral ---------- */
  main{ width: 100%; }

  section.category{ }
  .cat-head{
    display:flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 20px 24px;
  }
  .cat-head h2{
    font-size: clamp(19px, 2.8vw, 25px);
    margin: 0;
    font-weight: 700;
  }
  .cat-count{
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 12px;
    margin-top: 5px;
    display:block;
  }
  .drive-link{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--ink);
    color: #fff;
    border: 1px solid var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    transition: background .12s ease, color .12s ease;
    flex: 0 0 auto;
  }
  .drive-link:hover{ background: #fff; color: var(--ink); }

  /* Mosaico: grid denso de celdas chicas, rectángulos y celdas grandes,
     sin gutter propio — las líneas entre celdas son el fondo negro del
     propio grid asomando por un gap de 2px, como en la referencia. */
  .mosaic{
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-auto-rows: var(--unit);
    grid-auto-flow: dense;
    gap: 2px;
    background: #000;
  }
  .cell{
    position: relative;
    overflow: hidden;
    background: var(--bg);
    cursor: default;
  }
  .cell img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    transition: filter .2s ease;
  }
  figure.cell{ margin:0; cursor: zoom-in; }
  figure.cell:hover img{ filter: brightness(0.7); }

  .cell-video{ background:#000; }
  .cell-video iframe{
    position:absolute;
    border:0;
    /* El tamaño/posición real (para que el video "cubra" la celda como
       object-fit:cover, en vez de quedar con barras de letterbox) se
       calcula por video en JS y se aplica inline — estos son solo los
       valores por defecto de respaldo. */
    top:0; left:0; width:100%; height:100%;
  }
  /* Capa de click sobre el iframe: con controls=0 el player de Vimeo no
     dibuja NINGUNA interfaz propia, así que este es el único botón de
     play visible en el estado de previsualización — nada de barra de
     controles, título o marca de Vimeo tapando el video. Un solo click
     alterna play/pause a través del SDK de Vimeo. */
  .video-click-layer{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    background: transparent;
  }
  .video-play-badge{
    width:52px; height:52px;
    border-radius:50%;
    background: rgba(10,10,10,0.55);
    display:flex; align-items:center; justify-content:center;
    transition: opacity .15s ease;
  }
  .video-play-badge::after{
    content:'';
    margin-left:4px;
    border-style:solid;
    border-width:9px 0 9px 15px;
    border-color:transparent transparent transparent #fff;
  }
  .video-click-layer.is-playing .video-play-badge{ opacity:0; pointer-events:none; }

  .c-sm{ grid-column: span 1; grid-row: span 1; }
  .c-wide{ grid-column: span 2; grid-row: span 1; }
  .c-tall{ grid-column: span 1; grid-row: span 2; }
  .c-lg{ grid-column: span 2; grid-row: span 2; }

  /* Rectángulo vertical para video: se mantiene el mismo ancho mínimo
     de 2 columnas que ya se usaba con los embeds de Drive (por si el
     player de Vimeo también recorta su UI en anchos muy chicos), pero
     alargado a 3 filas para leerse como vertical. */
  .c-vtall{ grid-column: span 2; grid-row: span 3; }
  .cell-video.c-sm,
  .cell-video.c-tall,
  .cell-video.c-lg{ grid-column: span 2; }

  /* lightbox */
  #lightbox{
    position: fixed; inset:0;
    background: rgba(10,10,10,0.94);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 100;
    padding: 30px;
  }
  #lightbox.open{ display:flex; }
  #lightbox img{
    max-width: 92vw;
    max-height: 88vh;
  }
  #lightbox .close{
    position: absolute;
    top: 22px; right: 26px;
    width: 36px; height: 36px;
    display:flex; align-items:center; justify-content:center;
    background: #fff;
    font-size: 20px;
    color: var(--ink);
    cursor: pointer;
    line-height:1;
  }

  footer{
    text-align:center;
    padding: 34px 20px 50px;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 12px;
  }

  @media (max-width: 900px){
    :root{ --cols: 4; }
  }
  @media (max-width: 620px){
    :root{ --cols: 2; }
    header.hero{ padding: 18px 18px 14px; }
    .cat-head{ padding: 16px 16px; }
    /* En celular el grid ya solo tiene 2 columnas, así que cualquier
       celda de video (que siempre abarca 2 columnas) ocupa el ancho
       completo de la fila de forma natural — no hace falta forzarlo. */
  }
</style>
</head>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
// Helpers para construir las URLs de embed. Las fotos siguen alojadas
// en Google Drive. Los videos ahora están en Vimeo — son videos "solo
// con el link" (no listados/privados), así que cada uno necesita su
// propio hash de acceso además del id numérico para poder embeberse.
const imgUrl    = (id, w) => `https://lh3.googleusercontent.com/d/${id}=w${w||1000}`;
// controls=0: sin ninguna barra de controles nativa de Vimeo (ni
// siquiera el botón de play) — el botón de play propio (dibujado en
// CSS) y el play/pause se manejan enteramente con el SDK de Vimeo.
const vidUrl    = (id, h) => `https://player.vimeo.com/video/${id}?${h ? 'h=' + h + '&' : ''}title=0&byline=0&portrait=0&dnt=1&controls=0`;
const folderUrl = (id) => `https://drive.google.com/drive/folders/${id}`;

// Relación de aspecto (ancho/alto) de cada tamaño de celda del mosaico,
// usada para calcular cómo debe escalarse el iframe de un video para
// cubrir toda la celda sin dejar franjas negras de letterbox (el player
// de Vimeo, por defecto, mantiene la proporción del video real dentro
// de la caja que se le da, así que si esa proporción no coincide con la
// de la celda, el video queda "flotando" chico en el centro).
const SIZE_RATIOS = { sm: 1, wide: 2, tall: 0.5, lg: 1, vtall: 2 / 3 };

// Calcula el estilo inline (posición + tamaño en %) que hay que darle
// al iframe para que el video cubra toda la celda — el mismo efecto
// que object-fit:cover, pero aplicado a mano porque esa propiedad CSS
// no tiene efecto sobre el contenido de un iframe.
function videoCoverStyle(item){
  const containerRatio = SIZE_RATIOS[item.size] || 1;
  if (!item.natW || !item.natH) return '';
  const videoRatio = item.natW / item.natH;
  const scale = videoRatio / containerRatio;
  if (scale >= 1){
    const wPct = scale * 100;
    const leftPct = (100 - wPct) / 2;
    return `width:${wPct}%; height:100%; top:0; left:${leftPct}%;`;
  }
  const hPct = 100 / scale;
  const topPct = (100 - hPct) / 2;
  return `width:100%; height:${hPct}%; top:${topPct}%; left:0;`;
}

// Conecta el SDK de Vimeo a un iframe recién insertado: hace que el
// botón de play propio (dibujado en CSS, ver .video-play-badge) sea lo
// único visible antes de darle play, y que un click alterne play/pause.
// Si el script del SDK no llegó a cargar (sin red, bloqueado, etc.), se
// quita la capa de click y el iframe queda con su comportamiento nativo
// como respaldo, en vez de dejar el video sin forma de reproducirse.
function initVimeoPlayer(cellEl){
  const iframe = cellEl.querySelector('iframe');
  const layer = cellEl.querySelector('.video-click-layer');
  if (typeof Vimeo === 'undefined' || !Vimeo.Player){
    if (layer) layer.remove();
    return;
  }
  const player = new Vimeo.Player(iframe);
  let playing = false;
  const setPlaying = (v) => {
    playing = v;
    layer.classList.toggle('is-playing', v);
  };
  layer.addEventListener('click', () => {
    (playing ? player.pause() : player.play()).catch(() => {});
  });
  player.on('play', () => setPlaying(true));
  player.on('pause', () => setPlaying(false));
  player.on('ended', () => setPlaying(false));
}

// Separa un item de la lista "id/hash" de Vimeo en sus dos partes.
function parseVimeoRef(ref){
  const [id, h] = ref.split('/');
  return { id, h };
}

// Paleta ampliada (14 colores + negro) para las celdas decorativas
// "vacías" del mosaico, muestreada de la imagen de referencia "XITE"
// que compartió Ernesto — mezcla de pasteles y tonos muy saturados.
const PALETTE = [
  '#6fea76', // verde
  '#c899f7', // lavanda
  '#fe2712', // red ryb
  '#ea6e34', // naranja
  '#8fd6f9', // celeste
  '#52aff6', // azul
  '#fefc57', // amarillo
  '#eca5ed', // lila
  '#c7d84a', // verde lima
  '#7516e2', // violeta
  '#83c8a2', // menta
  '#000000'  // negro (bloques "vacíos", como la referencia)
];

// Los rectángulos verticales (foto: 1x2, video: vtall) solo se asignan
// a contenido cuya orientación real medida es "portrait" — nunca a algo
// horizontal o cuadrado, para no forzar un recorte raro. Estos son los
// patrones de variedad dentro de cada grupo de orientación.
const PORTRAIT_PHOTO_SIZES = ['tall', 'tall', 'lg', 'tall'];
const OTHER_PHOTO_SIZES    = ['sm', 'wide', 'sm', 'lg', 'sm', 'wide', 'sm', 'sm', 'lg', 'wide'];
// Para las celdas decorativas de color: mismo tamaño chico (1x1)
// siempre — antes variaban entre lg/wide/tall y quedaban recuadros
// demasiado grandes en el mosaico. La cantidad de bloques de color no
// cambia (sigue uno cada 3 elementos, ver buildItems); solo su tamaño.
const COLOR_SIZES = ['sm'];

// Determina la orientación real de una foto cargando la imagen y
// leyendo sus dimensiones naturales, en vez de asumir un patrón fijo.
// Si la miniatura tarda demasiado o falla, se asume horizontal por
// seguridad (nunca se fuerza un espacio vertical para contenido cuya
// orientación no pudimos confirmar).
function measureOrientation(url){
  return new Promise((resolve) => {
    let done = false;
    const finish = (w, h) => {
      if (done) return;
      done = true;
      let orientation = 'landscape';
      if (w > 0 && h > 0){
        if (h > w * 1.08) orientation = 'portrait';
        else if (w > h * 1.08) orientation = 'landscape';
        else orientation = 'square';
      }
      resolve({ w, h, orientation });
    };
    const img = new Image();
    img.onload = () => finish(img.naturalWidth, img.naturalHeight);
    img.onerror = () => finish(0, 0);
    setTimeout(() => finish(0, 0), 5000);
    img.src = url;
  });
}

// Igual que measureOrientation, pero para videos de Vimeo: en vez de
// cargar una miniatura, se consulta el endpoint oEmbed público de
// Vimeo (funciona también con videos privados/"solo con el link",
// siempre que la URL incluya el hash) para leer el ancho y alto reales
// del video y así decidir su orientación. Si el request falla o tarda
// demasiado, se asume horizontal por seguridad, igual que con fotos.
function measureVimeoOrientation(id, h){
  const oembedUrl = `https://vimeo.com/api/oembed.json?url=${encodeURIComponent('https://vimeo.com/' + id + (h ? '/' + h : ''))}`;
  const fetchPromise = fetch(oembedUrl)
    .then(r => r.ok ? r.json() : Promise.reject(new Error('oEmbed ' + r.status)))
    .then(data => {
      const w = data.width, hgt = data.height;
      let orientation = 'landscape';
      if (w > 0 && hgt > 0){
        if (hgt > w * 1.08) orientation = 'portrait';
        else if (w > hgt * 1.08) orientation = 'landscape';
        else orientation = 'square';
      }
      return { w, h: hgt, orientation };
    })
    .catch(() => ({ w: 0, h: 0, orientation: 'landscape' }));
  const timeout = new Promise((resolve) => setTimeout(() => resolve({ w: 0, h: 0, orientation: 'landscape' }), 5000));
  return Promise.race([fetchPromise, timeout]);
}

// Reparte dos listas entre sí de forma proporcional (no solo "una y
// una" — eso solo funciona si ambas miden lo mismo). Por ejemplo, con 9
// fotos y 17 videos, cada foto va quedando repartida a lo largo de
// todos los videos en vez de agotarse al principio y dejar el resto de
// la sección solo con videos. Es la misma idea que un algoritmo de
// Bresenham: en cada paso se toma del lado que, proporcionalmente a lo
// que ya se tomó de él, "le toca" en ese momento.
function interleave(a, b){
  const result = [];
  let ai = 0, bi = 0;
  const aLen = a.length, bLen = b.length;
  while (ai < aLen || bi < bLen){
    const aRatio = aLen ? ai / aLen : 1;
    const bRatio = bLen ? bi / bLen : 1;
    if (bi >= bLen || (ai < aLen && aRatio <= bRatio)){
      result.push(a[ai++]);
    } else {
      result.push(b[bi++]);
    }
  }
  return result;
}

// Combina fotos y videos (ya con su orientación medida) en una sola
// lista, repartiéndolos proporcionalmente entre sí (en vez de todas las
// fotos seguidas y luego todos los videos seguidos) e intercalando
// bloques de color decorativos cada 3 elementos (como los rellenos
// negros/de color de la referencia).
function buildItems(cat, photoOrientations, videoOrientations){
  const photoItems = cat.photos.map((id, i) => ({ type: 'photo', id, orientation: photoOrientations[i].orientation }));
  const videoItems = cat.videos.map((ref, i) => {
    const { id, h } = parseVimeoRef(ref);
    const vo = videoOrientations[i];
    return { type: 'video', id, h, n: i + 1, orientation: vo.orientation, natW: vo.w, natH: vo.h };
  });
  const base = interleave(photoItems, videoItems);
  const withDecor = [];
  let colorIdx = 0;
  base.forEach((item, i) => {
    withDecor.push(item);
    if ((i + 1) % 3 === 0){
      withDecor.push({ type: 'color', color: PALETTE[colorIdx % PALETTE.length] });
      colorIdx++;
    }
  });
  // remate: si la categoría no alcanzó ni un bloque de color, agrega uno.
  if (!withDecor.some(it => it.type === 'color') && base.length){
    withDecor.push({ type: 'color', color: PALETTE[0] });
  }
  return withDecor;
}

// Asigna tamaños recorriendo los items ya combinados. Los rectángulos
// verticales (tall / vtall) solo se reparten entre fotos y videos cuya
// orientación medida sea "portrait" — cualquier otra orientación (o una
// medición fallida) va a una forma no vertical. Cada grupo (fotos
// portrait, fotos no-portrait, colores) lleva su propio cursor para que
// la variedad de formas no dependa de la posición global.
function assignSizes(items){
  let portraitIdx = 0, otherIdx = 0, colorIdx = 0;
  items.forEach(item => {
    if (item.type === 'video'){
      item.size = item.orientation === 'portrait' ? 'vtall' : 'wide';
    } else if (item.type === 'photo'){
      if (item.orientation === 'portrait'){
        item.size = PORTRAIT_PHOTO_SIZES[portraitIdx++ % PORTRAIT_PHOTO_SIZES.length];
      } else {
        item.size = OTHER_PHOTO_SIZES[otherIdx++ % OTHER_PHOTO_SIZES.length];
      }
    } else {
      item.size = COLOR_SIZES[colorIdx++ % COLOR_SIZES.length];
    }
  });
  return items;
}

// Ancho x alto (en columnas/filas) de cada tamaño de celda — se usa
// para reconstruir qué casillas del grid quedaron realmente ocupadas.
const SIZE_SPANS = { sm: [1, 1], wide: [2, 1], tall: [1, 2], lg: [2, 2], vtall: [2, 3] };

// grid-auto-flow:dense va rellenando huecos a medida que coloca cada
// celda, pero al final de la lista de una sección casi siempre sobran
// columnas sueltas en la última fila (no hay más contenido para llenar
// ese hueco) — eso es lo que se ve como "espacio negro" asomando por el
// fondo del mosaico. En vez de tratar de adivinar de antemano cuántas
// columnas van a sobrar (depende del ancho real de columna, que cambia
// con el breakpoint), se deja que el navegador ubique todas las celdas
// reales primero y, ya con el grid conectado al documento, se lee la
// posición real (resuelta) que le tocó a cada una — el navegador expone
// esa posición "auto" resuelta a línea concreta vía getComputedStyle —
// para reconstruir qué casillas quedaron vacías y tapar exactamente esas
// con celditas chicas de color, del mismo tipo que las decorativas.
function fillGridGaps(grid){
  const colsVar = getComputedStyle(document.documentElement).getPropertyValue('--cols').trim();
  const cols = parseInt(colsVar, 10);
  if (!cols) return;
  const cells = [...grid.children];
  const occupied = new Set();
  let maxRow = 0;
  cells.forEach(el => {
    const cs = getComputedStyle(el);
    const rowStart = parseInt(cs.gridRowStart, 10);
    const colStart = parseInt(cs.gridColumnStart, 10);
    if (!rowStart || !colStart) return; // no se pudo leer la posición real: no forzamos nada
    let span = [1, 1];
    for (const size in SIZE_SPANS){
      if (el.classList.contains('c-' + size)){ span = SIZE_SPANS[size]; break; }
    }
    const [colSpan, rowSpan] = span;
    for (let r = 0; r < rowSpan; r++){
      for (let c = 0; c < colSpan; c++){
        occupied.add(`${rowStart + r},${colStart + c}`);
        if (rowStart + r > maxRow) maxRow = rowStart + r;
      }
    }
  });
  let colorIdx = 0;
  for (let r = 1; r <= maxRow; r++){
    for (let c = 1; c <= cols; c++){
      if (!occupied.has(`${r},${c}`)){
        const filler = document.createElement('div');
        filler.className = 'cell cell-color c-sm';
        filler.style.gridColumn = `${c} / span 1`;
        filler.style.gridRow = `${r} / span 1`;
        filler.style.background = PALETTE[colorIdx % PALETTE.length];
        filler.setAttribute('aria-hidden', 'true');
        grid.appendChild(filler);
        colorIdx++;
      }
    }
  }
}

function renderGrid(section, cat, items){
  const grid = document.createElement('div');
  grid.className = 'mosaic';
  items.forEach(item => {
    if (item.type === 'photo'){
      const fig = document.createElement('figure');
      fig.className = `cell c-${item.size}`;
      fig.innerHTML = `<img loading="lazy" src="${imgUrl(item.id, 600)}" alt="${cat.title}">`;
      fig.addEventListener('click', () => openLightbox(imgUrl(item.id, 1600)));
      grid.appendChild(fig);
    } else if (item.type === 'video'){
      const div = document.createElement('div');
      div.className = `cell cell-video c-${item.size}`;
      const coverStyle = videoCoverStyle(item);
      div.innerHTML = `<iframe src="${vidUrl(item.id, item.h)}" style="${coverStyle}" loading="lazy" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="${cat.title} — video ${item.n}"></iframe><div class="video-click-layer"><span class="video-play-badge" aria-hidden="true"></span></div>`;
      grid.appendChild(div);
      initVimeoPlayer(div);
    } else {
      const div = document.createElement('div');
      div.className = `cell cell-color c-${item.size}`;
      div.style.background = item.color;
      div.setAttribute('aria-hidden', 'true');
      grid.appendChild(div);
    }
  });
  section.appendChild(grid);
  fillGridGaps(grid);
}

CATEGORIES.forEach(cat => {
  // nav pill
  const a = document.createElement('a');
  a.href = `#${cat.key}`;
  a.textContent = cat.title;
  navEl.appendChild(a);

  // section (el grid se llena async, una vez medidas las orientaciones)
  const section = document.createElement('section');
  section.className = 'category';
  section.id = cat.key;

  const totalPhotos = cat.photosTotal || cat.photos.length;
  const totalVideos = cat.videos.length;

  const head = document.createElement('div');
  head.className = 'cat-head';
  head.innerHTML = `
    <div>
      <h2>${cat.title}</h2>
      <span class="cat-count mono">${totalPhotos} fotos · ${totalVideos} videos</span>
    </div>
    <a class="drive-link" href="${folderUrl(cat.folder)}" target="_blank" rel="noopener">Ver todo en Drive &rarr;</a>
  `;
  section.appendChild(head);
  mainEl.appendChild(section);

  // Mide la orientación real de cada foto (miniatura de Drive) y de
  // cada video (metadata de Vimeo vía oEmbed) antes de decidir qué
  // celdas pueden ser rectángulos verticales.
  Promise.all([
    Promise.all(cat.photos.map(id => measureOrientation(imgUrl(id, 200)))),
    Promise.all(cat.videos.map(ref => {
      const { id, h } = parseVimeoRef(ref);
      return measureVimeoOrientation(id, h);
    }))
  ]).then(([photoOrientations, videoOrientations]) => {
    const items = assignSizes(buildItems(cat, photoOrientations, videoOrientations));
    if (items.length) renderGrid(section, cat, items);
  });
});

// lightbox behavior (solo fotos — los videos van embebidos directo en
// el mosaico, con el reproductor propio de Vimeo)
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
