<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Paleta ampliada (14 colores), extraída por muestreo de la imagen de
     referencia "XITE" que compartió Ernesto: un grid de tarjetas con
     texto saturado sobre fondos de tono relacionado, mezclando tonos
     pastel y tonos muy vivos. Más negro puro para las celdas "vacías"
     del mosaico, como el grid de logos de la referencia de Afternow en
     Dribbble. */
  :root{
    --bg: #ffffff;
    --ink: #0a0a0a;
    --ink-dim: #6b6a61;
    --header-bg: #0a0a0a;
    --header-ink: #ffffff;
    --c-verde: #6fea76;
    --c-lavanda: #c899f7;
    --c-red-ryb: #fe2712;
    --c-naranja: #ea6e34;
    --c-celeste: #8fd6f9;
    --c-azul: #52aff6;
    --c-amarillo: #fefc57;
    --c-lila: #eca5ed;
    --c-verde-lima: #c7d84a;
    --c-violeta: #7516e2;
    --c-menta: #83c8a2;
    --cols: 6;
    /* La altura de fila debe igualar el ancho real de columna para que
       las celdas chicas sean cuadrados 1:1 y las anchas queden 2:1. El
       grid es a todo el ancho (100vw, sin padding), así que el ancho de
       columna es (100vw - gaps) / cols. */
    --unit: calc((100vw - (var(--cols) - 1) * 2px) / var(--cols));
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }
  .mono{ font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }

  /* ---------- Header: negro, tipografía blanca, compacto (menos alto
     que la referencia de Afternow, que gasta mucho alto en botones e
     iconos que aquí no necesitamos). header.hero (logotipo + botones de
     categoría) es lo que queda fijo arriba al hacer scroll; para que un
     elemento sticky se quede pegado durante TODO el scroll de la página
     necesita vivir directo en el flujo del body (su "contenedor" sticky
     es la altura completa de la página) — por eso .hero-desc, el texto
     de descripción, va fuera de <header>, como hermano siguiente, y así
     se desplaza normalmente con el resto del contenido en vez de quedar
     atrapado dentro de una franja de solo ~160px de alto. */
  header.hero{
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--header-bg);
    color: var(--header-ink);
    padding: 18px 24px 14px;
  }
  header.hero .top-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .logo-slot{
    display:flex;
    align-items:center;
    gap: 10px;
    min-height: 28px; /* espacio reservado para un logotipo real */
  }
  .logo-mark{
    display:block;
    width:auto;
  }
  header.hero h1{
    /* Mitad del tamaño original (era clamp(20px, 3.2vw, 30px)). */
    font-size: clamp(10px, 1.6vw, 15px);
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.15;
    text-align: right;
  }
  /* No sticky: vive fuera de header.hero, así que se desplaza con el
     resto de la página en cuanto se hace scroll. Mismo fondo negro para
     que, en la posición inicial (scroll 0), se vea continuo con el
     header de arriba. Sin max-width: ocupa todo el ancho de la página. */
  .hero-desc{
    background: var(--header-bg);
    color: #b9b8b0;
    font-size: 13.5px;
    margin: 0;
    padding: 16px 24px 20px;
    line-height: 1.5;
  }

  nav.catnav{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 16px;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  nav.catnav::-webkit-scrollbar{ display:none; }
  nav.catnav a{
    flex: 0 0 auto;
    padding: 6px 12px;
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
    color: #fff;
    background: transparent;
    border: 1px solid #fff;
    text-decoration: none;
    white-space: nowrap;
    transition: background .12s ease, color .12s ease;
  }
  nav.catnav a:hover{ background: #fff; color: #000; }

  /* ---------- Cuerpo: mosaico full-bleed, sin padding lateral ---------- */
  main{ width: 100%; }

  section.category{ }
  .cat-head{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    padding: 30px 24px 16px;
  }
  .cat-head h2{
    font-size: clamp(19px, 2.8vw, 25px);
    margin: 0;
    font-weight: 700;
  }
  .cat-count{
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 12px;
    margin-top: 5px;
    display:block;
  }
  .drive-link{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--ink);
    color: #fff;
    border: 1px solid var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    transition: background .12s ease, color .12s ease;
    flex: 0 0 auto;
  }
  .drive-link:hover{ background: #fff; color: var(--ink); }

  /* Mosaico: grid denso de celdas chicas, rectángulos y celdas grandes,
     sin gutter propio — las líneas entre celdas son el fondo negro del
     propio grid asomando por un gap de 2px, como en la referencia. */
  .mosaic{
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-auto-rows: var(--unit);
    grid-auto-flow: dense;
    gap: 2px;
    background: #000;
  }
  .cell{
    position: relative;
    overflow: hidden;
    background: var(--bg);
    cursor: default;
  }
  .cell img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    transition: filter .2s ease;
  }
  figure.cell{ margin:0; cursor: zoom-in; }
  figure.cell:hover img{ filter: brightness(0.7); }

  .cell-video{ background:#000; }
  .cell-video iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
  }

  .c-sm{ grid-column: span 1; grid-row: span 1; }
  .c-wide{ grid-column: span 2; grid-row: span 1; }
  .c-tall{ grid-column: span 1; grid-row: span 2; }
  .c-lg{ grid-column: span 2; grid-row: span 2; }

  /* Rectángulo vertical para video: los iframes de Drive muestran una
     interfaz recortada cuando su ancho renderizado cae muy por debajo
     de ~380-400px, así que un video nunca puede quedar en una columna
     angosta de 1 unidad. Este variante mantiene el ancho seguro de 2
     columnas pero lo alarga a 3 filas para leerse como vertical. */
  .c-vtall{ grid-column: span 2; grid-row: span 3; }
  .cell-video.c-sm,
  .cell-video.c-tall,
  .cell-video.c-lg{ grid-column: span 2; }

  /* lightbox */
  #lightbox{
    position: fixed; inset:0;
    background: rgba(10,10,10,0.94);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 100;
    padding: 30px;
  }
  #lightbox.open{ display:flex; }
  #lightbox img{
    max-width: 92vw;
    max-height: 88vh;
  }
  #lightbox .close{
    position: absolute;
    top: 22px; right: 26px;
    width: 36px; height: 36px;
    display:flex; align-items:center; justify-content:center;
    background: #fff;
    font-size: 20px;
    color: var(--ink);
    cursor: pointer;
    line-height:1;
  }

  footer{
    text-align:center;
    padding: 34px 20px 50px;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 12px;
  }

  @media (max-width: 900px){
    :root{ --cols: 4; }
  }
  @media (max-width: 620px){
    :root{ --cols: 2; }
    header.hero{ padding: 18px 18px 14px; }
    .cat-head{ padding: 24px 16px 12px; }
    /* En celular el grid ya solo tiene 2 columnas, así que cualquier
       celda de video (que siempre abarca 2 columnas) ocupa el ancho
       completo de la fila de forma natural — no hace falta forzarlo. */
  }
</style>
</head>

// Los rectángulos verticales (foto: 1x2, video: vtall) solo se asignan
// a contenido cuya orientación real medida es "portrait" — nunca a algo
// horizontal o cuadrado, para no forzar un recorte raro. Estos son los
// patrones de variedad dentro de cada grupo de orientación.
const PORTRAIT_PHOTO_SIZES = ['tall', 'tall', 'lg', 'tall'];
const OTHER_PHOTO_SIZES    = ['sm', 'wide', 'sm', 'lg', 'sm', 'wide', 'sm', 'sm', 'lg', 'wide'];
// Para las celdas decorativas de color (sin contenido real, pueden ser
// cualquier forma libremente).
const COLOR_SIZES = ['lg', 'sm', 'wide', 'tall', 'sm', 'lg'];

// Determina la orientación real de una foto o del fotograma-miniatura de
// un video cargando la imagen y leyendo sus dimensiones naturales, en
// vez de asumir un patrón fijo. Si la miniatura tarda demasiado o falla,
// se asume horizontal por seguridad (nunca se fuerza un espacio vertical
// para contenido cuya orientación no pudimos confirmar).
function measureOrientation(url){
  return new Promise((resolve) => {
    let done = false;
    const finish = (w, h) => {
      if (done) return;
      done = true;
      let orientation = 'landscape';
      if (w > 0 && h > 0){
        if (h > w * 1.08) orientation = 'portrait';
        else if (w > h * 1.08) orientation = 'landscape';
        else orientation = 'square';
      }
      resolve({ w, h, orientation });
    };
    const img = new Image();
    img.onload = () => finish(img.naturalWidth, img.naturalHeight);
    img.onerror = () => finish(0, 0);
    setTimeout(() => finish(0, 0), 5000);
    img.src = url;
  });
}

const navEl = document.getElementById('catnav');
const mainEl = document.getElementById('main');

// Combina fotos y videos (ya con su orientación medida) en una sola
// lista, intercalando bloques de color decorativos cada 3 elementos
// (como los rellenos negros/de color de la referencia).
function buildItems(cat, photoOrientations, videoOrientations){
  const base = [
    ...cat.photos.map((id, i) => ({ type: 'photo', id, orientation: photoOrientations[i].orientation })),
    ...cat.videos.map((id, i) => ({ type: 'video', id, n: i + 1, orientation: videoOrientations[i].orientation }))
  ];
  const withDecor = [];
  let colorIdx = 0;
  base.forEach((item, i) => {
    withDecor.push(item);
    if ((i + 1) % 3 === 0){
      withDecor.push({ type: 'color', color: PALETTE[colorIdx % PALETTE.length] });
      colorIdx++;
    }
  });
  // remate: si la categoría no alcanzó ni un bloque de color, agrega uno.
  if (!withDecor.some(it => it.type === 'color') && base.length){
    withDecor.push({ type: 'color', color: PALETTE[0] });
  }
  return withDecor;
}

// Asigna tamaños recorriendo los items ya combinados. Los rectángulos
// verticales (tall / vtall) solo se reparten entre fotos y videos cuya
// orientación medida sea "portrait" — cualquier otra orientación (o una
// medición fallida) va a una forma no vertical. Cada grupo (fotos
// portrait, fotos no-portrait, colores) lleva su propio cursor para que
// la variedad de formas no dependa de la posición global.
function assignSizes(items){
  let portraitIdx = 0, otherIdx = 0, colorIdx = 0;
  items.forEach(item => {
    if (item.type === 'video'){
      item.size = item.orientation === 'portrait' ? 'vtall' : 'wide';
    } else if (item.type === 'photo'){
      if (item.orientation === 'portrait'){
        item.size = PORTRAIT_PHOTO_SIZES[portraitIdx++ % PORTRAIT_PHOTO_SIZES.length];
      } else {
        item.size = OTHER_PHOTO_SIZES[otherIdx++ % OTHER_PHOTO_SIZES.length];
      }
    } else {
      item.size = COLOR_SIZES[colorIdx++ % COLOR_SIZES.length];
    }
  });
  return items;
}

function renderGrid(section, cat, items){
  const grid = document.createElement('div');
  grid.className = 'mosaic';
  items.forEach(item => {
    if (item.type === 'photo'){
      const fig = document.createElement('figure');
      fig.className = `cell c-${item.size}`;
      fig.innerHTML = `<img loading="lazy" src="${imgUrl(item.id, 600)}" alt="${cat.title}">`;
      fig.addEventListener('click', () => openLightbox(imgUrl(item.id, 1600)));
      grid.appendChild(fig);
    } else if (item.type === 'video'){
      const div = document.createElement('div');
      div.className = `cell cell-video c-${item.size}`;
      div.innerHTML = `<iframe src="${vidUrl(item.id)}" loading="lazy" allow="autoplay" allowfullscreen title="${cat.title} — video ${item.n}"></iframe>`;
      grid.appendChild(div);
    } else {
      const div = document.createElement('div');
      div.className = `cell cell-color c-${item.size}`;
      div.style.background = item.color;
      div.setAttribute('aria-hidden', 'true');
      grid.appendChild(div);
    }
  });
  section.appendChild(grid);
}

CATEGORIES.forEach(cat => {
  // nav pill
  const a = document.createElement('a');
  a.href = `#${cat.key}`;
  a.textContent = cat.title;
  navEl.appendChild(a);

  // section (el grid se llena async, una vez medidas las orientaciones)
  const section = document.createElement('section');
  section.className = 'category';
  section.id = cat.key;

  const totalPhotos = cat.photosTotal || cat.photos.length;
  const totalVideos = cat.videosTotal || cat.videos.length;

  const head = document.createElement('div');
  head.className = 'cat-head';
  head.innerHTML = `
    <div>
      <h2>${cat.title}</h2>
      <span class="cat-count mono">${totalPhotos} fotos · ${totalVideos} videos en Drive</span>
    </div>
    <a class="drive-link" href="${folderUrl(cat.folder)}" target="_blank" rel="noopener">Ver todo en Drive &rarr;</a>
  `;
  section.appendChild(head);
  mainEl.appendChild(section);

  // Mide la orientación real de cada foto y de la miniatura de cada
  // video antes de decidir qué celdas pueden ser rectángulos verticales.
  Promise.all([
    Promise.all(cat.photos.map(id => measureOrientation(imgUrl(id, 200)))),
    Promise.all(cat.videos.map(id => measureOrientation(imgUrl(id, 200))))
  ]).then(([photoOrientations, videoOrientations]) => {
    const items = assignSizes(buildItems(cat, photoOrientations, videoOrientations));
    if (items.length) renderGrid(section, cat, items);
  });
});

// lightbox behavior (solo fotos — los videos van embebidos directo en
// el mosaico como pidió Ernesto)
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
